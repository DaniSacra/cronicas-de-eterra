<body>
  <div id="game">
    <div id="screen">
      <canvas id="view" width="320" height="200"></canvas>
      <div id="overlay"></div>
      <div id="hud"></div>
      <div id="hudtop"></div>
      <div id="hudbar"><div id="info"></div></div>
      <button id="wmBtn" hidden title="Mapa de Eterra (U)" aria-label="Mapa de Eterra"><img class="wm-ico" alt=""></button>
      <div id="bottom">
        <div id="dialog"><canvas id="face" width="32" height="32"></canvas><div id="msgbox"><div id="speaker"></div><div id="msg"></div><div id="menu"></div></div></div>
        <div id="party"></div>
      </div>
    </div>
    <div id="touch">
      <div class="pad">
        <button data-k="q" class="glyph">⇤</button><button data-k="ArrowUp" class="glyph">▲</button><button data-k="e" class="glyph">⇥</button>
        <button data-k="ArrowLeft" class="glyph">↺</button><button data-k="ArrowDown" class="glyph">▼</button><button data-k="ArrowRight" class="glyph">↻</button>
      </div>
      <div class="pad2">
        <button data-k="Enter">OK</button><button data-k="Escape" class="glyph">✕</button><button data-k="m" class="small">MAPA</button>
      </div>
    </div>
  </div>
